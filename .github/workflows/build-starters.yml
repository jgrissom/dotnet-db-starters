name: Build every starter

# These are the folders students copy on lab night. A starter that does not
# compile wastes the first ten minutes of a lab for everybody, so every project
# here is built and every checks project is RUN on each push.
#
# FAILING TESTS ARE THE EXPECTED RESULT: a lab starter is red on purpose and a
# homework skeleton scores 0/N by design. A build error or a crash is not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Console programs block on ReadLine forever, so stdin gets a few newlines
      # (which satisfies an interactive program rather than making ReadLine
      # return null) and every run is capped.
      - name: Build and run every week's checks
        run: |
          fail=0
          shopt -s nullglob
          for proj in week-*/*.Checks/*.csproj; do
            echo "── $proj"
            if ! dotnet build "$proj" -warnaserror -nologo; then
              echo "::error::$proj does not build"
              fail=1
              continue
            fi
            # `|| code=$?` is load-bearing: this step runs under `bash -e`, so a
            # bare failing command aborts the whole script before the exit code
            # can be inspected. Week 1 of the course repo failed CI for exactly
            # this — the starter correctly reported 1/5 and line 2 never ran.
            code=0
            printf '\n\n\n\n' | timeout 300 dotnet test "$proj" --no-build --nologo || code=$?
            # 0 = all green, 1 = tests failed (fine). Anything else is a crash,
            # a hang (124 from timeout), or a runner problem.
            if [ "$code" -gt 1 ]; then
              echo "::error::$proj exited $code (crash, hang or runner error)"
              fail=1
            fi
          done
          exit $fail

      # The semester-project checks (week 4 on) live under project/, not under
      # week-NN/, because the lab's `cp -r ../dotnet-db-starters/week-NN .`
      # would otherwise drag them into the coursework repo where they do not
      # belong. So the loop above cannot see them, and they need their own step.
      #
      # There is no student project to build them against — the student runs
      # `dotnet new` themselves — so CI makes an EMPTY one. That is not a
      # workaround; it is the course's own rule enforced automatically:
      #
      #     run every new check against the untouched `dotnet new console`
      #     template, because anything that passes there is free points.
      #
      # An untouched project must score 0. If any check goes green here, it is
      # green for every student who created a repo and did nothing in it.
      - name: Project checks must score ZERO against an empty project
        run: |
          fail=0
          shopt -s nullglob
          for checks in project/week-*/Project.Checks; do
            week=$(dirname "$checks")
            echo "── $checks (against an untouched dotnet new console)"
            rm -rf /tmp/probe && mkdir -p /tmp/probe
            dotnet new console -o /tmp/probe/Project --no-restore
            cp -r "$checks" /tmp/probe/Project.Checks
            if ! dotnet build /tmp/probe/Project.Checks -warnaserror -nologo; then
              echo "::error::$checks does not build"
              fail=1
              continue
            fi
            code=0
            printf '\n\n\n\n' | timeout 300 dotnet test /tmp/probe/Project.Checks \
              --no-build --nologo --logger "trx;LogFileName=r.trx" \
              --results-directory /tmp/probe/res || code=$?
            if [ "$code" -gt 1 ]; then
              echo "::error::$checks exited $code (crash, hang or runner error)"
              fail=1
              continue
            fi
            # Any outcome="Passed" here is a check an empty project satisfies.
            if grep -q 'outcome="Passed"' /tmp/probe/res/r.trx; then
              echo "::error::$checks has a check that PASSES on an empty project — free points"
              grep -o 'testName="[^"]*" *[^>]*outcome="Passed"' /tmp/probe/res/r.trx || true
              fail=1
            else
              echo "   ✓ 0 passed, as required"
            fi
          done
          exit $fail
