name: Build every starter

# These are the folders students copy on lab night. A starter that does not
# compile wastes the first ten minutes of a lab for everybody, so every project
# here is built and every checks project is RUN on each push.
#
# FAILING TESTS ARE THE EXPECTED RESULT: a lab starter is red on purpose and a
# homework skeleton scores 0/N by design. A build error or a crash is not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Console programs block on ReadLine forever, so stdin gets a few newlines
      # (which satisfies an interactive program rather than making ReadLine
      # return null) and every run is capped.
      - name: Build and run every week's checks
        run: |
          fail=0
          shopt -s nullglob
          for proj in week-*/*.Checks/*.csproj; do
            echo "── $proj"
            if ! dotnet build "$proj" -warnaserror -nologo; then
              echo "::error::$proj does not build"
              fail=1
              continue
            fi
            # `|| code=$?` is load-bearing: this step runs under `bash -e`, so a
            # bare failing command aborts the whole script before the exit code
            # can be inspected. Week 1 of the course repo failed CI for exactly
            # this — the starter correctly reported 1/5 and line 2 never ran.
            code=0
            printf '\n\n\n\n' | timeout 300 dotnet test "$proj" --no-build --nologo || code=$?
            # 0 = all green, 1 = tests failed (fine). Anything else is a crash,
            # a hang (124 from timeout), or a runner problem.
            if [ "$code" -gt 1 ]; then
              echo "::error::$proj exited $code (crash, hang or runner error)"
              fail=1
            fi
          done
          exit $fail
